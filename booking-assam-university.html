<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registration Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            background: #f5f5f7;
            color: #1d1d1f;
        }

        /* Header */
        header {
            height: 70px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid #e5e5e5;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 25px;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .back-btn {
            text-decoration: none;
            color: #007aff;
            font-size: 15px;
            font-weight: 500;

            padding: 9px 16px;
            border-radius: 20px;

            transition: 0.2s;
        }

        .back-btn:hover {
            background: #eaf3ff;
        }

        /* Main */
        main {
            width: 100%;
            max-width: 950px;
            margin: 35px auto;
            padding: 0 15px;
        }

        .title-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .title-section h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .title-section p {
            color: #6e6e73;
            font-size: 15px;
        }

        /* Form Card */
        .form-card {
            background: #ffffff;
            border-radius: 18px;

            overflow: hidden;

            box-shadow:
                0 4px 20px rgba(0, 0, 0, 0.06);

            border: 1px solid #e5e5e5;
        }

        iframe {
            display: block;
            width: 100%;
            height: 1200px;
            border: none;
        }

        /* Loading */
        .loading {
            height: 1200px;

            display: flex;
            justify-content: center;
            align-items: center;

            flex-direction: column;
            gap: 15px;

            color: #777;
        }

        .spinner {
            width: 35px;
            height: 35px;

            border: 4px solid #e5e5e5;
            border-top: 4px solid #007aff;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 30px 15px;

            color: #86868b;
            font-size: 13px;
        }

        /* Mobile */
        @media (max-width: 600px) {

            header {
                height: 60px;
                padding: 0 15px;
            }

            .logo {
                font-size: 17px;
            }

            .back-btn {
                font-size: 14px;
                padding: 8px 12px;
            }

            main {
                margin: 20px auto;
                padding: 0 7px;
            }

            .title-section {
                margin-bottom: 15px;
            }

            .title-section h1 {
                font-size: 25px;
            }

            .title-section p {
                font-size: 13px;
            }

            .form-card {
                border-radius: 10px;
            }

            iframe {
                height: 1400px;
            }

            .loading {
                height: 1400px;
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header>

        <div class="logo">
            Registration
        </div>

        <a href="index.html" class="back-btn">
            ← Back
        </a>

    </header>


    <!-- MAIN CONTENT -->
    <main>

        <div class="title-section">

            <h1>Registration Form</h1>

            <p>
                Please fill in all the required details carefully.
            </p>

        </div>


        <!-- GOOGLE FORM -->
        <div class="form-card">

            <!-- Loading Screen -->
            <div class="loading" id="loading">

                <div class="spinner"></div>

                <span>Loading form...</span>

            </div>


            <!-- Google Form -->
            <iframe
                id="googleForm"
                src="https://docs.google.com/forms/d/e/1FAIpQLSdkh1qEDcgRWRIDIyP7ODmTda_AWTlAkOboDYpgbb5lcmGHmA/viewform?embedded=true"
                loading="lazy"
                onload="formLoaded()">
            </iframe>

        </div>

    </main>


    <!-- FOOTER -->
    <footer>

        © 2026 Registration Portal

    </footer>


    <script>

        function formLoaded() {

            document.getElementById("loading").style.display = "none";

        }

    </script>

</body>
</html>
